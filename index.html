<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>papu pagina</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>bienvenidos a papulandia</h1>
        <p>mi primera pagina papus</p>
    </header>

    <main>
        <h2>pe causa</h2>
        
               <!-- Aquí va la imagen -->
        <img src="xd.jpg" alt="xd" width="400" height="300">

        <video width="100%" controls autoplay muted loop>
            <source src="peru.mp4" type="video/mp4">
            Tu navegador no soporta el video.
        </video>
    </main>

    <footer>
        <p>@ 2026 - pagina de ivan hurtado jaimes</p>
    </footer>

    <button id="btn-musica" style="position:fixed; bottom:20px; right:20px; z-index:1000; padding:10px 15px; border-radius:50px; border:none; background:#333; color:white; cursor:pointer;">
        Activar musica
    </button>

    <audio id="musica-fondo" loop>
        <source src="xd.mp3" type="audio/mpeg">
    </audio>

    <script>
        const btn = document.getElementById('btn-musica');
        const musica = document.getElementById('musica-fondo');
        let reproduciendo = false;

        btn.addEventListener('click', async () => {
            if (!reproduciendo) {
                try {
                    await musica.play();
                    reproduciendo = true;
                    btn.textContent = 'Silenciar musica';
                } catch (error) {
                    console.log("Error al reproducir:", error);
                }
            } else {
                musica.pause();
                reproduciendo = false;
                btn.textContent = 'Activar musica';
            }
        });
    </script>
</body>
</html>
